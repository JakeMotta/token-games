name: registry-publish
# After a registry change lands on main: check the committed, signed registry/index.json and publish it with its
# signature on GitHub Pages at https://jakemotta.github.io/token-games/registry/index.json. The index is signed on the
# key holder's Mac (`tg-registry sign --keychain`); no private key is ever in GitHub. CI only checks that the
# signature is by a key built into the app (shell/src/catalog/keys.ts) and that the index is exactly what the
# pointers and the blocklist give (it downloads each released bundle and checks its sha256), and publishes nothing
# otherwise. Needs Pages turned on with "GitHub Actions" as source.
on:
  push:
    branches: [main]
    paths: ['registry/**', '.github/workflows/registry-publish.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: registry-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the CLI
        working-directory: cli
        run: npm ci && npm run build
      - name: Check the signed index
        id: check
        run: |
          set -euo pipefail
          node cli/dist/tg-registry.js check registry
          if [ ! -f registry/index.json ]; then
            echo "::warning::Not published: registry/index.json is not committed yet (docs/first-game-walkthrough.md, Publish)"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          node cli/dist/tg-registry.js check-index registry
          mkdir -p _site/registry
          cp registry/index.json registry/index.json.sig _site/registry/
          printf '<!doctype html><meta charset="utf-8"><title>Token Games catalog</title><p>The Token Games catalog: <a href="registry/index.json">registry/index.json</a> (signed: <a href="registry/index.json.sig">index.json.sig</a>). <a href="https://github.com/JakeMotta/token-games">Source</a>.</p>\n' > _site/index.html
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        if: steps.check.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
