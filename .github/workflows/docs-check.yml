name: docs-check
# Docs must match the shell: a pull request that changes the wrapper must update CLAUDE.md and README.md too.
on: pull_request
permissions:
  contents: read
jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/
      - run: node scripts/check-docs.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
