<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>Ant Farm</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The farm. The shell (shell/src/page/shell-page.ts) builds the island, the window's title bar and the Settings
     sheet around it, and moves #farm between the notch, the drop-down and the window. -->
<div class="af" id="farm">
  <canvas id="view"></canvas>
  <pre class="stats" id="stats" hidden></pre>
</div>

<!-- The farm's own sections of the Settings sheet; the shell adds Display and Reset below them. -->
<div id="afPanel" hidden>
  <section>
    <h4>Colours</h4>
    <div class="pals" id="pals"></div>
    <p class="tg-note" id="palNote"></p>
    <label class="tg-row">Calm <input type="range" id="calm" min="0" max="100" step="5"><output id="calmV"></output></label>
    <label class="tg-row"><input type="checkbox" id="fadeIdle"> Fade when idle</label>
  </section>
  <section>
    <h4>Colony</h4>
    <div class="health" id="health"></div>
  </section>
  <section>
    <h4>Map</h4>
    <div class="tg-chips" id="maps">
      <button data-map="large">Large</button><button data-map="huge">Huge</button><button data-map="ridiculous">Ridiculous</button>
    </div>
    <p class="tg-note" id="mapNote"></p>
  </section>
  <section>
    <h4>Claude Code</h4>
    <p class="tg-note" id="feedNote"></p>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
