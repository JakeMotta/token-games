<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>Ant Farm</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="farm" id="farm">
  <canvas id="view"></canvas>
  <div class="bar" id="bar">
    <span class="pulse" id="pulse"></span>
    <span class="fname">Ant Farm</span>
    <span class="meter" id="meter"></span>
    <span class="evt" id="evt"></span>
    <span class="wbtns">
      <button class="wbtn" id="bSmall" title="Small, 320 × 180 (1)">S</button>
      <button class="wbtn" id="bLarge" title="Large, 640 × 360 (2)">L</button>
      <button class="wbtn" id="bFull" title="Full screen (F; Esc leaves)"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 4.5V1h3.5M11 4.5V1H7.5M1 7.5V11h3.5M11 7.5V11H7.5"/></svg></button>
      <button class="wbtn" id="bThru" title="Click-through: clicks go to the window behind (T; hold Alt over the farm to take it back)"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 1.5l7 3.6-3 .9-1.2 2.9z" fill="currentColor" stroke="none"/><path d="M1.2 10.8l9.6-9.6"/></svg></button>
      <button class="wbtn" id="bGear" title="Settings (,)"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="6" cy="6" r="1.8"/><path d="M6 .8v1.6M6 9.6v1.6M.8 6h1.6M9.6 6h1.6M2.3 2.3l1.1 1.1M8.6 8.6l1.1 1.1M2.3 9.7l1.1-1.1M8.6 3.4l1.1-1.1"/></svg></button>
      <button class="wbtn" id="bHide" title="Hide to the menu bar (H)"><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5"><path d="M2.5 6h7"/></svg></button>
    </span>
  </div>
  <div class="grip br" id="grip" title="Drag to resize (keeps 16:9)"></div>
  <div class="sizetag" id="sizetag"></div>

  <div class="panel" id="panel" hidden>
    <section>
      <h4>Colours</h4>
      <div class="pals" id="pals"></div>
      <p class="note" id="palNote"></p>
      <label class="row">Calm <input type="range" id="calm" min="0" max="100" step="5"><output id="calmV"></output></label>
      <label class="row"><input type="checkbox" id="fadeIdle"> Fade when idle</label>
      <label class="row"><input type="checkbox" id="reducedMotion"> Reduced motion</label>
    </section>
    <section>
      <h4>Window</h4>
      <div class="chips" id="sizes">
        <button data-size="small">Small</button><button data-size="large">Large</button><button id="pFull">Full screen</button>
      </div>
      <p class="note" id="sizeNote"></p>
      <div class="row">Dock
        <span class="docks" id="docks">
          <button data-dock="tl" title="Top left">◰</button><button data-dock="tr" title="Top right">◳</button>
          <button data-dock="bl" title="Bottom left">◱</button><button data-dock="br" title="Bottom right">◲</button>
          <button data-dock="free" title="Where I drop it">free</button>
        </span>
      </div>
      <label class="row">Opacity <input type="range" id="opacity" min="25" max="100" step="5"><output id="opacityV"></output></label>
      <label class="row"><input type="checkbox" id="alwaysOnTop"> Always on top</label>
      <label class="row"><input type="checkbox" id="clickThrough"> Click-through</label>
    </section>
    <section>
      <h4>Feed</h4>
      <label class="row"><input type="checkbox" id="claudeFeed"> Watch Claude Code</label>
      <p class="note" id="feedNote"></p>
      <div class="chips">
        <button id="fTokens" title="K">+5k tokens</button><button id="fTask" title="N">Task done</button><button id="fWide" title="A room too wide to hold">Wide room</button>
      </div>
    </section>
    <section>
      <div class="chips"><button id="reset">Reset settings</button><button id="pClose">Close</button></div>
      <p class="note keys">Keys: 1 small · 2 large · F full screen · T click-through · H hide · , settings · P palette · D dock · A auto camera · K tokens · N task done</p>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
