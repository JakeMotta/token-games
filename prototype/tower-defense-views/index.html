<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tower Defense Views</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Bungee&family=Caveat:wght@500;700&family=Fredoka:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Orbitron:wght@500;800&family=Press+Start+2P&family=Rye&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101114; --panel: #191b20; --line: #2a2d35; --text: #e8e9ec; --muted: #9a9ea8; --accent: #f4c04e;
  }
  :root[data-theme="light"] { --bg: #f3f2ee; --panel: #ffffff; --line: #dcd9d0; --text: #1d1e22; --muted: #62656e; --accent: #b07b06; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: block; min-height: 100vh; }
  header { padding: 10px 16px 0; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
  .tab {
    flex: 1 0 150px; max-width: 220px; text-align: left; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); border-radius: 8px; padding: 7px 9px; font: inherit;
  }
  .tab b { display: block; font-size: 13px; }
  .tab small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.3; margin-top: 2px; }
  .tab i { font-style: normal; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .tab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tab.all { flex: 0 0 92px; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 2px 0 10px; }
  #bar button { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; }
  #bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #bar .hint { color: var(--muted); font-size: 12.5px; margin-left: 4px; }
  #blurb { color: var(--muted); font-size: 12.5px; margin-left: auto; }
  main { padding: 0 16px 16px; }
  .stage {
    position: relative; margin: 0 auto; aspect-ratio: 16 / 9; background: #000; overflow: hidden; border-radius: 6px;
    width: min(100%, calc((100vh - var(--head, 150px) - 20px) * 16 / 9)); touch-action: manipulation;
  }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
  .stage[hidden] { display: none; }
  main.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 10px; }
  main.grid .stage { width: 100%; cursor: pointer; }
  main.grid .stage::after {
    content: attr(data-name); position: absolute; left: 6px; bottom: 6px; padding: 2px 7px; border-radius: 4px;
    background: rgba(0,0,0,.65); color: #fff; font-size: 12px; pointer-events: none;
  }
  #result { display: none; }
  @media (max-width: 700px) { .tab { flex-basis: 128px; } #blurb { display: none; } }
</style>
</head>
<body>
<header>
  <nav id="tabs" role="tablist"></nav>
  <div id="bar">
    <button id="pause" aria-pressed="false">Pause</button>
    <button data-speed="1" aria-pressed="true">1×</button>
    <button data-speed="2" aria-pressed="false">2×</button>
    <button data-speed="4" aria-pressed="false">4×</button>
    <button id="feed">Feed 5k tokens</button>
    <button id="burst">Feed 40k</button>
    <button id="stream" aria-pressed="true">Agent stream</button>
    <button id="menu">Build menu</button>
    <span class="hint">Tap a spot or tower to build or upgrade. Tap the bucket to feed it.</span>
    <span id="blurb"></span>
  </div>
</header>
<main id="main"></main>
<pre id="result"></pre>
<script src="td.js"></script>
<script src="art.js"></script>
<script>window.VIEWS = [];</script>
<script src="views/common.js"></script>
<script src="views/pixel.js"></script>
<script src="views/iso.js"></script>
<script src="views/hex.js"></script>
<script src="views/lanes.js"></script>
<script src="views/ink.js"></script>
<script src="views/neon.js"></script>
<script src="views/blueprint.js"></script>
<script src="views/toy.js"></script>
<script src="app.js"></script>
</body>
</html>
