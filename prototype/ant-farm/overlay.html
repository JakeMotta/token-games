<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ant Farm Overlay</title>
<style>
  /* Layout: a control strip on top, then a 1440 × 900 Mac screen scaled to fit, with the farm window floating on it. */
  :root {
    --page: #e9ecf2; --strip: #f7f8fb; --strip-line: #d5dae4; --ink: #1d2330; --ink-dim: #5d6678; --accent: #b4542f;
    --chip: #ffffff; --chip-on: #fbe9df;
    --wall-a: #9fc3e8; --wall-b: #f2c9b0; --wall-c: #e9a58e; --wall-d: #7fa4d6; --wall-e: #c7dbf2;
    --menubar: rgba(246, 247, 250, 0.62); --menubar-ink: #1b1f27;
    --dock: rgba(246, 247, 250, 0.42); --dock-line: rgba(255, 255, 255, 0.55);
    --term-bg: #fbfbfc; --term-bar: #ececf0; --term-ink: #22262e; --term-dim: #7b8291; --term-line: #d3d6dd;
    --cc: #c96442; --cc-soft: #e9a587; --ok: #3b8a4a; --add: #e6f4e8; --tool: #2e6bd6;
    --farm-shadow: 0 10px 30px rgba(20, 28, 48, 0.28), 0 1px 3px rgba(20, 28, 48, 0.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --page: #0f1218; --strip: #161a22; --strip-line: #2a303c; --ink: #dfe3ea; --ink-dim: #8c94a5; --accent: #e5875f;
    --chip: #1d222c; --chip-on: #3a261d;
    --wall-a: #1b2550; --wall-b: #4b2a5e; --wall-c: #7a3a52; --wall-d: #101a3a; --wall-e: #2a3d78;
    --menubar: rgba(22, 24, 32, 0.55); --menubar-ink: #eef0f5;
    --dock: rgba(40, 42, 52, 0.45); --dock-line: rgba(255, 255, 255, 0.14);
    --term-bg: #1c1d22; --term-bar: #2a2b31; --term-ink: #dcdfe5; --term-dim: #8a90a0; --term-line: #3a3c44;
    --cc: #e5875f; --cc-soft: #a05a3e; --ok: #7cc68a; --add: #1f3324; --tool: #7aa7ff;
    --farm-shadow: 0 12px 34px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --page: #0f1218; --strip: #161a22; --strip-line: #2a303c; --ink: #dfe3ea; --ink-dim: #8c94a5; --accent: #e5875f;
    --chip: #1d222c; --chip-on: #3a261d;
    --wall-a: #1b2550; --wall-b: #4b2a5e; --wall-c: #7a3a52; --wall-d: #101a3a; --wall-e: #2a3d78;
    --menubar: rgba(22, 24, 32, 0.55); --menubar-ink: #eef0f5;
    --dock: rgba(40, 42, 52, 0.45); --dock-line: rgba(255, 255, 255, 0.14);
    --term-bg: #1c1d22; --term-bar: #2a2b31; --term-ink: #dcdfe5; --term-dim: #8a90a0; --term-line: #3a3c44;
    --cc: #e5875f; --cc-soft: #a05a3e; --ok: #7cc68a; --add: #1f3324; --tool: #7aa7ff;
    --farm-shadow: 0 12px 34px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
  html, body { margin: 0; background: var(--page); color: var(--ink); }
  body { display: block; height: auto; min-height: 100vh; font: 12px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }

  /* ---------- control strip ---------- */
  .strip { flex: none; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 16px; background: var(--strip);
    border-bottom: 1px solid var(--strip-line); }
  .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
  .grp > .lbl { color: var(--ink-dim); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; margin-right: 2px; }
  .strip button { font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--strip-line); border-radius: 6px;
    padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .strip button:hover { border-color: var(--ink-dim); }
  .strip button:focus-visible, .wbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .strip button.on { background: var(--chip-on); border-color: var(--accent); color: var(--accent); }
  kbd { font: 10px ui-monospace, Menlo, monospace; color: var(--ink-dim); margin-left: 4px; }
  .strip button.on kbd { color: var(--accent); }
  input[type=range] { width: 90px; accent-color: var(--accent); }
  #opv { width: 34px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .strip a { color: var(--accent); text-decoration: none; margin-left: auto; }
  .strip a:hover { text-decoration: underline; }

  /* ---------- the Mac screen ---------- */
  .stage { padding: 12px 16px 16px; display: flex; justify-content: center; }
  .fit { position: relative; flex: none; }
  .screen { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; overflow: hidden;
    border-radius: 12px; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 20px 50px rgba(0, 0, 0, 0.25); user-select: none; }
  .wall { position: absolute; inset: 0; }
  .wall svg { width: 100%; height: 100%; display: block; }
  .menubar { position: absolute; left: 0; right: 0; top: 0; height: 25px; display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: var(--menubar); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
    color: var(--menubar-ink); font-size: 13px; z-index: 5; }
  .menubar .apple { font-size: 15px; width: 14px; text-align: center; }
  .menubar b { font-weight: 700; }
  .menubar .right { margin-left: auto; display: flex; gap: 16px; align-items: center; font-variant-numeric: tabular-nums; }
  .menubar svg { display: block; }
  #mbAnt { display: flex; align-items: center; gap: 5px; padding: 1px 6px; border-radius: 4px; cursor: pointer; }
  #mbAnt:hover, #mbAnt.on { background: rgba(127, 127, 127, 0.25); }
  .dock { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); display: flex; gap: 8px; padding: 6px 8px;
    border-radius: 18px; background: var(--dock); border: 1px solid var(--dock-line);
    backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5); z-index: 4; }
  .app { width: 52px; height: 52px; border-radius: 12px; position: relative; display: grid; place-items: center;
    box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25), 0 1px 2px rgba(0, 0, 0, 0.2); font: 600 22px/1 -apple-system, system-ui, sans-serif; color: #fff; }
  .app.run::after { content: ''; position: absolute; bottom: -5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--menubar-ink); opacity: 0.7; }
  .a1 { background: linear-gradient(90deg, #3d8bf2 50%, #e9f1fb 50%); }
  .a2 { background: radial-gradient(circle at 50% 50%, #fff 0 30%, #2c7bf0 31% 100%); }
  .a3 { background: #1e1f24; font: 700 17px/1 ui-monospace, Menlo, monospace; color: #e6e6e6; }
  .a4 { background: linear-gradient(#f6d35b 0 26%, #fffbea 26%); }
  .a5 { background: #d97757; font-size: 28px; }
  .a6 { background: linear-gradient(#9aa1ab, #6b727d); }
  .a7 { background: linear-gradient(#e8c79a, #a2734a); }

  /* terminal running Claude Code */
  .term { position: absolute; left: 110px; top: 64px; width: 880px; height: 600px; border-radius: 11px; overflow: hidden; z-index: 2;
    background: var(--term-bg); color: var(--term-ink); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.32), 0 0 0 0.5px rgba(0, 0, 0, 0.4);
    display: flex; flex-direction: column; }
  .term .tbar { flex: none; height: 28px; background: var(--term-bar); display: flex; align-items: center; padding: 0 12px; gap: 8px;
    border-bottom: 1px solid var(--term-line); font-size: 12.5px; color: var(--term-dim); }
  .term.focused .tbar { color: var(--term-ink); }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25); }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .term .tbar .t { flex: 1; text-align: center; margin-right: 52px; }
  .tout { flex: 1; overflow: hidden; padding: 10px 14px; font: 12.5px/1.5 "SF Mono", ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap;
    display: flex; flex-direction: column; justify-content: flex-end; }
  .tout > div { min-height: 1.5em; }
  .cc { color: var(--cc); } .dim { color: var(--term-dim); } .ok { color: var(--ok); } .tl { color: var(--tool); font-weight: 600; }
  .welcome { border: 1px solid var(--cc); border-radius: 6px; padding: 6px 10px; margin-bottom: 8px; align-self: flex-start; }
  .prompt { border: 1px solid var(--term-line); border-radius: 6px; padding: 4px 10px; margin-top: 6px; }
  .add { background: var(--add); }
  .cursor { display: inline-block; width: 7px; height: 14px; background: var(--term-ink); vertical-align: -2px; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* click-through proof: a ring where a click landed */
  .ripple { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; border: 2px solid var(--accent);
    pointer-events: none; z-index: 30; animation: ripple 0.7s ease-out forwards; }
  @keyframes ripple { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }

  /* ---------- the ant farm window ---------- */
  .farm { position: absolute; z-index: 20; border-radius: 10px; overflow: hidden; background: #12151d; box-shadow: var(--farm-shadow);
    outline: 1px solid rgba(255, 255, 255, 0.12); outline-offset: -1px; transition: opacity 0.2s; }
  .farm.anim { transition: left 0.22s ease, top 0.22s ease, width 0.22s ease, height 0.22s ease, border-radius 0.22s, opacity 0.2s; }
  .farm canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .farm.full { border-radius: 0; outline: none; }
  .farm.thru { pointer-events: none; }
  .farm.thru.grab { pointer-events: auto; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 20px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px;
    background: linear-gradient(rgba(12, 14, 20, 0.78), rgba(12, 14, 20, 0.5)); color: #cfd3dc; cursor: grab;
    font: 10.5px/1 ui-monospace, "SF Mono", Menlo, monospace; transition: opacity 0.25s; }
  .farm.full .bar { height: 26px; font-size: 12px; }
  .bar:active { cursor: grabbing; }
  .farm.calm .bar { opacity: 0.55; }
  .farm:hover .bar, .farm.grab .bar { opacity: 1; }
  .farm.thru .bar { opacity: 0; }
  .farm.thru.grab .bar { opacity: 1; }
  .pulse { width: 6px; height: 6px; border-radius: 50%; background: #6b7387; flex: none; transition: background 0.3s, box-shadow 0.3s; }
  .pulse.hot { background: #e8b45e; box-shadow: 0 0 6px #e8b45e; }
  .pulse.task { background: #88c58f; box-shadow: 0 0 6px #88c58f; }
  .fname { color: #eef0f4; font-weight: 600; white-space: nowrap; }
  .meter { color: #9aa3b5; white-space: nowrap; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .meter b { color: #e8b45e; font-weight: 600; }
  .evt { color: #e8b45e; white-space: nowrap; opacity: 0; transition: opacity 0.4s; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .evt.show { opacity: 1; }
  .wbtns { margin-left: auto; display: flex; gap: 1px; flex: none; }
  .wbtn { width: 18px; height: 16px; display: grid; place-items: center; border: 0; border-radius: 3px; background: transparent; color: #aeb5c4;
    font: 600 9.5px/1 ui-monospace, Menlo, monospace; cursor: pointer; padding: 0; }
  .farm.full .wbtn { width: 24px; height: 20px; font-size: 11px; }
  .wbtn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
  .wbtn.on { color: #e8b45e; }
  .wbtn svg { width: 11px; height: 11px; display: block; }
  .farm.full .wbtn svg { width: 13px; height: 13px; }
  .grip { position: absolute; width: 14px; height: 14px; cursor: nwse-resize; touch-action: none; }
  .grip::before { content: ''; position: absolute; inset: 3px; border: 0 solid rgba(255, 255, 255, 0.45); }
  .grip.br { right: 0; bottom: 0; } .grip.br::before { border-width: 0 2px 2px 0; border-bottom-right-radius: 4px; }
  .grip.tl { left: 0; top: 20px; } .grip.tl::before { border-width: 2px 0 0 2px; border-top-left-radius: 4px; }
  .grip.bl { left: 0; bottom: 0; cursor: nesw-resize; } .grip.bl::before { border-width: 0 0 2px 2px; border-bottom-left-radius: 4px; }
  .grip.tr { right: 0; top: 20px; cursor: nesw-resize; } .grip.tr::before { border-width: 2px 2px 0 0; border-top-right-radius: 4px; }
  .grip { opacity: 0; transition: opacity 0.2s; }
  .farm:hover .grip, .farm.grab .grip { opacity: 1; }
  .farm.full .grip { display: none; }
  .sizetag { position: absolute; right: 6px; bottom: 5px; font: 10px ui-monospace, Menlo, monospace; color: rgba(255, 255, 255, 0.75);
    background: rgba(0, 0, 0, 0.45); padding: 1px 4px; border-radius: 3px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .sizetag.show { opacity: 1; }
  .floater { position: absolute; left: 10px; bottom: 8px; font: 600 11px ui-monospace, Menlo, monospace; color: #e8b45e; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); animation: floatup 1.6s ease-out forwards; }
  @keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
  .snap { position: absolute; z-index: 19; border: 2px dashed rgba(232, 180, 94, 0.9); border-radius: 10px; pointer-events: none; display: none; }
  .snap.show { display: block; }
  #result { display: none; }
  @media (prefers-reduced-motion: reduce) { .farm.anim { transition: none; } .ripple, .floater { animation-duration: 0.01s; } }
</style>
</head>
<body>
<div class="strip" role="toolbar" aria-label="Mock-up controls">
  <div class="grp"><span class="lbl">Window</span>
    <button id="cS" data-size="S">Small 320×180<kbd>1</kbd></button>
    <button id="cL" data-size="L">Large 640×360<kbd>2</kbd></button>
    <button id="cF">Full screen<kbd>F</kbd></button>
  </div>
  <div class="grp"><span class="lbl">Mouse</span><button id="cT">Click-through<kbd>T</kbd></button></div>
  <div class="grp"><span class="lbl">Opacity</span><input id="op" type="range" min="25" max="100" value="100" aria-label="Window opacity"><span id="opv">100%</span></div>
  <div class="grp"><span class="lbl">Dock</span>
    <button id="dTL" data-dock="tl" title="Top left">↖</button><button id="dTR" data-dock="tr" title="Top right">↗</button>
    <button id="dBL" data-dock="bl" title="Bottom left">↙</button><button id="dBR" data-dock="br" title="Bottom right">↘</button>
    <button id="dFree" data-dock="" title="Free: drag it anywhere">Free</button><kbd>D</kbd>
  </div>
  <div class="grp"><span class="lbl">Agent</span>
    <button id="cFeed">+5k tokens<kbd>K</kbd></button><button id="cTask">Task done</button><button id="cAuto" class="on">Claude working</button>
  </div>
  <div class="grp"><span class="lbl">Ants</span><button data-look="rust" class="on">Rust</button><button data-look="black">Black</button><button data-look="glow">Glow</button></div>
  <div class="grp"><span class="lbl">Desktop</span><button id="thL" data-th="light">Light</button><button id="thD" data-th="dark">Dark</button></div>
  <a href="sprites.html">Ant sprites, before / after</a>
</div>

<div class="stage" id="stage">
  <div class="fit" id="fit">
    <div class="screen" id="screen">
      <div class="wall" aria-hidden="true">
        <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="var(--wall-d)"/><stop offset="0.55" stop-color="var(--wall-a)"/><stop offset="1" stop-color="var(--wall-b)"/></linearGradient>
            <linearGradient id="h1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--wall-e)"/><stop offset="1" stop-color="var(--wall-c)"/></linearGradient>
            <linearGradient id="h2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wall-c)"/><stop offset="1" stop-color="var(--wall-d)"/></linearGradient>
            <linearGradient id="h3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--wall-b)"/><stop offset="1" stop-color="var(--wall-a)"/></linearGradient>
          </defs>
          <rect width="1440" height="900" fill="url(#sky)"/>
          <path d="M0 560 C 260 470 420 520 640 450 S 1080 380 1440 470 L 1440 900 L 0 900 Z" fill="url(#h1)" opacity="0.85"/>
          <path d="M0 690 C 300 600 560 700 820 620 S 1220 560 1440 640 L 1440 900 L 0 900 Z" fill="url(#h2)" opacity="0.9"/>
          <path d="M0 800 C 340 740 640 820 960 760 S 1300 730 1440 770 L 1440 900 L 0 900 Z" fill="url(#h3)" opacity="0.8"/>
        </svg>
      </div>
      <div class="menubar">
        <span class="apple">&#xF8FF;</span><b>Terminal</b><span>Shell</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
        <span class="right">
          <span id="mbAnt" title="Ant Farm: show or hide the window (H)">
            <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor" aria-hidden="true"><ellipse cx="3.2" cy="5" rx="3" ry="2.4"/><ellipse cx="8" cy="4.6" rx="2" ry="1.5"/><circle cx="12" cy="4" r="1.8"/><path d="M13 2.4l1.6-2M13.6 2.8l2-1" stroke="currentColor" stroke-width="0.8"/><path d="M6.4 6l-1.6 4M8 6v4.2M9.6 6l1.6 4" stroke="currentColor" stroke-width="0.9"/></svg>
            <span id="mbTok">0</span>
          </span>
          <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="M8 11.2l2.3-2.6a3.3 3.3 0 0 0-4.6 0z M3.6 6.6a6.2 6.2 0 0 1 8.8 0l1.2-1.3a8 8 0 0 0-11.2 0z M1 3.9a9.9 9.9 0 0 1 14 0l1-1.1a11.5 11.5 0 0 0-16 0z" fill="currentColor"/></svg>
          <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true"><rect x="0.5" y="0.5" width="20" height="11" rx="3" fill="none" stroke="currentColor" opacity="0.6"/><rect x="2" y="2" width="14" height="8" rx="1.6" fill="currentColor"/><rect x="21.5" y="4" width="1.6" height="4" rx="0.8" fill="currentColor" opacity="0.6"/></svg>
          <span id="clock">Fri Nov 27 9:41 AM</span>
        </span>
      </div>

      <div class="term focused" id="term">
        <div class="tbar"><span class="lights"><i></i><i></i><i></i></span><span class="t">token-games — claude — 110×34</span></div>
        <div class="tout" id="tout"></div>
      </div>

      <div class="dock" aria-hidden="true">
        <span class="app a1"></span><span class="app a2"></span><span class="app a3 run">&gt;_</span><span class="app a5 run">✻</span>
        <span class="app a4"></span><span class="app a7 run">
          <svg width="30" height="20" viewBox="0 0 16 11" fill="#3a1d12"><ellipse cx="3.2" cy="5" rx="3" ry="2.4"/><ellipse cx="8" cy="4.6" rx="2" ry="1.5"/><circle cx="12" cy="4" r="1.8"/><path d="M13 2.4l1.6-2M13.6 2.8l2-1" stroke="#3a1d12" stroke-width="0.8"/><path d="M6.4 6l-1.6 4M8 6v4.2M9.6 6l1.6 4" stroke="#3a1d12" stroke-width="0.9"/></svg>
        </span><span class="app a6"></span>
      </div>

      <div class="snap" id="snap"></div>
      <div class="farm calm" id="farm" role="region" aria-label="Ant Farm window">
        <canvas id="view"></canvas>
        <div class="bar" id="bar">
          <span class="pulse" id="pulse"></span>
          <span class="fname">Ant Farm</span>
          <span class="meter" id="meter"></span>
          <span class="evt" id="evt"></span>
          <span class="wbtns">
            <button class="wbtn" data-size="S" title="Small 320×180 (1)">S</button>
            <button class="wbtn" data-size="L" title="Large 640×360 (2)">L</button>
            <button class="wbtn" id="wFull" title="Full screen (F)"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 4.5V1h3.5M11 4.5V1H7.5M1 7.5V11h3.5M11 7.5V11H7.5"/></svg></button>
            <button class="wbtn" id="wThru" title="Click-through: clicks pass to the window behind (T, hold ⌥ to grab)"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 1.5l7 3.6-3 .9-1.2 2.9z" fill="currentColor" stroke="none"/><path d="M1.2 10.8l9.6-9.6"/></svg></button>
            <button class="wbtn" id="wHide" title="Hide to the menu bar (H)"><svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5"><path d="M2.5 6h7"/></svg></button>
          </span>
        </div>

        <div class="sizetag" id="sizetag"></div>

    </div>
  </div>
</div>
<pre id="result"></pre>

<script src="sim.js"></script>
<script src="camera.js"></script>
<script src="render.js"></script>
<script>
(function () {
  'use strict';
  const errors = [];
  window.addEventListener('error', (e) => errors.push(String(e.message || e)));
  const q = new URLSearchParams(location.search);
  const TEST = q.has('test');
  const $ = (id) => document.getElementById(id);

  // ---------- the mock screen and its work area (menu bar above, Dock below) ----------
  const SW = 1440, SH = 900, MENU = 25, DOCKH = 76, MARGIN = 12, BAR = 20, MINW = 256;
  const WORK = { x: 0, y: MENU, w: SW, h: SH - MENU - DOCKH };

  // ---------- window state ----------
  const st = { w: 320, x: 0, y: 0, dock: 'br', full: false, thru: false, hidden: false, opacity: 100, prev: null, size: 'S' };
  const h9 = (w) => Math.round(w * 9 / 16);
  function dockPos(d, w, h) {
    const x = d[1] === 'l' ? WORK.x + MARGIN : WORK.x + WORK.w - MARGIN - w;
    const y = d[0] === 't' ? WORK.y + MARGIN : WORK.y + WORK.h - MARGIN - h;
    return { x, y };
  }
  function layout(animate) {
    animate = animate && !TEST;
    farm.classList.toggle('anim', !!animate);
    let x, y, w, h;
    if (st.full) { x = 0; y = 0; w = SW; h = SH; }
    else {
      w = st.w; h = h9(w);
      if (st.dock) ({ x, y } = dockPos(st.dock, w, h));
      else { x = Math.max(0, Math.min(SW - w, st.x)); y = Math.max(MENU, Math.min(SH - h, st.y)); }
      st.x = x; st.y = y;
    }
    st.box = { x, y, w, h };
    Object.assign(farm.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', opacity: st.opacity / 100 });
    farm.classList.toggle('full', st.full);
    farm.style.display = st.hidden ? 'none' : '';
    // the grip sits on the corner away from the dock, so resizing grows the window into the screen
    const g = $('grip'), gc = st.dock ? (st.dock[0] === 't' ? 'b' : 't') + (st.dock[1] === 'l' ? 'r' : 'l') : 'br';
    g.className = 'grip ' + gc; g.dataset.corner = gc;
    st.size = st.full ? 'F' : w === PRESETS.S ? 'S' : w === PRESETS.L ? 'L' : 'free';
    syncControls();
    if (animate) setTimeout(() => { farm.classList.remove('anim'); draw(true); }, 260);
    draw(true);
  }
  function setSize(s) {
    if (st.full) exitFull(false);
    st.w = PRESETS[s];
    if (!st.dock) { st.x = Math.min(st.x, SW - st.w - MARGIN); st.y = Math.min(st.y, WORK.y + WORK.h - h9(st.w) - MARGIN); }
    layout(true); showSize();
  }
  function enterFull() { if (st.full) return; st.prev = { w: st.w, x: st.x, y: st.y, dock: st.dock }; st.full = true; st.hidden = false; layout(true); showSize(); }
  function exitFull(relayout) {
    if (!st.full) return;
    st.full = false; Object.assign(st, st.prev || {});
    if (relayout !== false) { layout(true); showSize(); }
  }
  const toggleFull = () => (st.full ? exitFull() : enterFull());
  function setThru(on) { st.thru = on; farm.classList.toggle('thru', on); syncControls(); }
  function setDock(d) { if (st.full) exitFull(false); st.dock = d || null; layout(true); }
  function setHidden(h) { st.hidden = h; if (h && st.full) exitFull(false); layout(false); }
  function syncControls() {
    const on = (el, v) => el && el.classList.toggle('on', !!v);
    on($('cS'), st.size === 'S'); on($('cL'), st.size === 'L'); on($('cF'), st.full); on($('cT'), st.thru);
    document.querySelectorAll('.wbtn[data-size]').forEach((b) => on(b, st.size === b.dataset.size));
    on($('wThru'), st.thru);
    document.querySelectorAll('[data-dock]').forEach((b) => on(b, (st.dock || '') === b.dataset.dock && !st.full));
    $('wFull').title = st.full ? 'Exit full screen (Esc)' : 'Full screen (F)';
    $('wFull').innerHTML = st.full
      ? '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4.5 1v3.5H1M7.5 1v3.5H11M4.5 11V7.5H1M7.5 11V7.5H11"/></svg>'
      : '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 4.5V1h3.5M11 4.5V1H7.5M1 7.5V11h3.5M11 7.5V11H7.5"/></svg>';
    $('mbAnt').classList.toggle('on', !st.hidden);
  }
  let sizeT = 0;
  function showSize() {
    const t = $('sizetag');
    t.textContent = st.box.w + ' × ' + st.box.h;
    t.classList.add('show'); clearTimeout(sizeT); sizeT = setTimeout(() => t.classList.remove('show'), 1200);
  }

  // ---------- drag the bar to move (snaps to a corner when let go near one), drag the grip to resize ----------
  const local = (e) => { const r = screen.getBoundingClientRect(); return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k }; };

  const capture = (el, e) => { try { el.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events have no live pointer */ } };
  function nearestDock(x, y, w, h) {
    let best = null, bd = 70;

    return best;
  }
  $('bar').addEventListener('pointerdown', (e) => {
    if (e.target.closest('.wbtn') || st.full) return;
    const p = local(e);

    e.stopPropagation();

      if (d) { const q2 = dockPos(d, st.w, h9(st.w)); Object.assign(sn.style, { left: q2.x + 'px', top: q2.y + 'px', width: st.w + 'px', height: h9(st.w) + 'px' }); }

      if (!st.dock) { st.x = drag.c[1] === 'r' ? drag.ax : drag.ax - w; st.y = drag.c[0] === 'b' ? drag.ay : drag.ay - h9(w); }

    }
  });
  window.addEventListener('pointerup', (e) => {
    if (!drag) return;
    if (drag.kind === 'move') {
      const d = nearestDock(st.x, st.y, st.w, h9(st.w));
      $('snap').classList.remove('show');
      if (d) { st.dock = d; layout(true); }
    }
    drag = null;
  });

  // clicks that reach the desktop (including through the farm when click-through is on) leave a ring
  screen.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.farm')) return;
    const p = local(e), r = document.createElement('div');
    r.className = 'ripple'; r.style.left = p.x + 'px'; r.style.top = p.y + 'px';
    screen.appendChild(r); setTimeout(() => r.remove(), 800);
    $('term').classList.toggle('focused', !!e.target.closest('.term'));
  });

  // ---------- controls ----------
  document.querySelectorAll('[data-size]').forEach((b) => b.addEventListener('click', () => setSize(b.dataset.size)));
  $('cF').onclick = toggleFull; $('wFull').onclick = toggleFull;
  $('cT').onclick = () => setThru(!st.thru); $('wThru').onclick = () => setThru(!st.thru);
  $('wHide').onclick = () => setHidden(true); $('mbAnt').onclick = () => setHidden(!st.hidden);
  document.querySelectorAll('[data-dock]').forEach((b) => b.addEventListener('click', () => setDock(b.dataset.dock)));
  $('op').oninput = () => { st.opacity = +$('op').value; $('opv').textContent = st.opacity + '%'; farm.style.opacity = st.opacity / 100; };
  let look = q.get('look') || 'rust';
  document.querySelectorAll('[data-look]').forEach((b) => b.addEventListener('click', () => {
    look = b.dataset.look; document.querySelectorAll('[data-look]').forEach((x) => x.classList.toggle('on', x === b)); draw(true);
  }));
  function setTheme(t) {
    if (t) document.documentElement.dataset.theme = t;
    const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    $('thL').classList.toggle('on', !dark); $('thD').classList.toggle('on', dark);
  }
  $('thL').onclick = () => setTheme('light'); $('thD').onclick = () => setTheme('dark');
  setTheme(q.get('theme'));
  const DOCKS = ['tr', 'br', 'bl', 'tl'];
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Alt') { farm.classList.add('grab'); return; }

    else if (key === '2') setSize('L');

    else if (e.key === 'Escape') exitFull();
    else if (key === 't') setThru(!st.thru);
    else if (key === 'h') setHidden(!st.hidden);
    else if (key === 'k') feedTokens();

    e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { if (e.key === 'Alt') farm.classList.remove('grab'); });
  window.addEventListener('blur', () => farm.classList.remove('grab'));

  // ---------- the farm ----------
  const sim = AntSim.createSim({ seed: +(q.get('seed') || 7) });
  sim.run(+(q.get('warp') || 6500));
  const buf = AntRender.makeBuffer(sim);
  let cam = null, lastAnts = null, lastDraw = 0, lastT = 0, acc = 0;
  function sizeCanvas() {
    const dpr = Math.min(3, (window.devicePixelRatio || 1) * k);

    return { vw, vh, dpr };
  }
  function target(vw, vh) {
    const bar = st.full ? 26 : BAR;

    return { x: t.x, y: t.y - bar / t.s, s: t.s };
  }

  const fmt = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n)));
  function meter() {
    const ants = sim.ants.length - 1;
    $('meter').innerHTML = '<b>⚡' + Math.floor(sim.energy) + '</b> · ' + fmt(sim.stats.tokens) + ' tok' + (st.w >= 420 || st.full ? ' · ' + ants + ' ants · ' + sim.brood.length + ' brood' : '');
    $('mbTok').textContent = fmt(sim.stats.tokens);
  }
  let evtT = 0;
  function event(label, kind) {
    const p = $('pulse'), e = $('evt');
    p.classList.remove('hot', 'task'); void p.offsetWidth; p.classList.add(kind === 'task' ? 'task' : 'hot');
    e.textContent = label; e.classList.add('show');
    clearTimeout(evtT); evtT = setTimeout(() => { e.classList.remove('show'); p.classList.remove('hot', 'task'); }, 2600);
    const f = document.createElement('div'); f.className = 'floater'; f.textContent = label;
    if (!st.hidden) { farm.appendChild(f); setTimeout(() => f.remove(), 1700); }
    meter();
  }
  function feedTokens(n, label) {
    n = n || 5000;
    sim.feed({ v: 1, source: 'mock', type: 'tokens', input: Math.round(n * 0.6), output: Math.round(n * 0.4), ts: Date.now() });
    event(label || '+' + fmt(n) + ' tokens');
  }
  function taskDone() { sim.feed({ v: 1, source: 'mock', type: 'task_done' }); event('task done → new gallery', 'task'); }
  $('cFeed').onclick = () => feedTokens();
  $('cTask').onclick = taskDone;

  function frame(t) {
    requestAnimationFrame(frame);
    if (document.hidden) { lastT = t; return; }
    const dt = Math.min(250, t - (lastT || t)); lastT = t;
    acc += dt * AntSim.TICK_HZ / 1000;
    let n = 0;
    while (acc >= 1 && n < 40) { sim.step(); acc -= 1; n++; }
    if (n >= 40) acc = 0;
    const busy = sim.isBusy() || drag;
    farm.classList.toggle('calm', !busy);
    if (t - lastDraw >= (busy ? 1000 / 30 : 1000 / 8) - 2) { lastDraw = t; draw(false); }
  }

  // ---------- the terminal: Claude Code at work; each step it takes feeds the farm ----------
  const tout = $('tout');
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  function line(html, cls) { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; tout.insertBefore(d, spin); trim(); return d; }
  function trim() { while (tout.children.length > 30) tout.removeChild(tout.children[1]); }
  tout.innerHTML = '<div class="welcome"><span class="cc">✻</span> Welcome to <b>Claude Code</b>\n\n  <span class="dim">/help for help, /status for your current setup\n\n  cwd: ~/Documents/GitHub/token-games</span></div>';
  const spin = document.createElement('div'); tout.appendChild(spin);
  const input = document.createElement('div'); input.className = 'prompt'; input.innerHTML = '&gt; <span class="cursor"></span>'; tout.appendChild(input);
  const hint = document.createElement('div'); hint.className = 'dim'; hint.textContent = '  ? for shortcuts'; tout.appendChild(hint);
  const RUNS = [
    { ask: 'add a day/night sky to the ant farm, tied to the local clock', steps: [
      ['say', "I'll look at how the sky is painted first.", 1300],
      ['tool', 'Read', 'prototype/ant-farm/sim.js', 'Read 868 lines', 4200],
      ['tool', 'Search', 'pattern: "skyTop"', 'Found 3 matches in 2 files', 900],
      ['say', 'The sky is a fixed gradient in the palette. I will blend it by the hour instead.', 1500],
      ['edit', 'Update', 'prototype/ant-farm/sim.js', 'Updated with 18 additions and 4 removals', 3600],
      ['tool', 'Bash', 'node --test prototype/ant-farm/test', 'tests 21 · pass 21 · fail 0', 2600],
      ['done', 'The sky now fades from dawn to night with the local clock. All tests pass.', 1800] ] },
    { ask: 'the spoil heap gets too tall near the entrance; spread it out', steps: [
      ['tool', 'Read', 'prototype/ant-farm/sim.js', 'Read 120 lines', 3100],
      ['say', 'Ants drop grains at the first open cell. I will make them walk a few cells further when the heap is steep.', 1700],
      ['edit', 'Update', 'prototype/ant-farm/sim.js', 'Updated with 9 additions and 2 removals', 2900],
      ['tool', 'Bash', 'node --test prototype/ant-farm/test/sim.test.js', 'tests 12 · pass 12 · fail 0', 2200],
      ['done', 'The heap now spreads into a low mound on both sides of the entrance.', 1500] ] },
  ];
  let run = 0, step = -1, auto = true, termT = 0, spinT = 0, spinTok = 0, spinStart = 0;
  const GLYPHS = '·✢✳✶✻✽✻✶✳✢', VERBS = ['Thinking', 'Reading', 'Tunnelling', 'Pondering', 'Working'];
  function spinner() {
    if (!auto) { spin.innerHTML = ''; return; }
    const s = Math.floor((performance.now() - spinStart) / 1000);
    spin.innerHTML = '<span class="cc">' + GLYPHS[Math.floor(performance.now() / 120) % GLYPHS.length] + ' ' + VERBS[run % VERBS.length] + '…</span> <span class="dim">(' + s + 's · ↓ ' + fmt(spinTok) + ' tokens · esc to interrupt)</span>';
  }
  function next() {
    if (!auto) return;
    const R = RUNS[run % RUNS.length];
    if (step < 0) { line('<span class="dim">&gt;</span> ' + esc(R.ask)); line(''); step = 0; spinStart = performance.now(); spinTok = 0; return later(1400); }
    const s = R.steps[step++];
    if (!s) { run++; step = -1; line(''); return later(3500); }
    const tok = s[s.length - 1];
    spinTok += tok;
    if (s[0] === 'say') line('<span class="cc">⏺</span> ' + esc(s[1]));
    else if (s[0] === 'tool' || s[0] === 'edit') {
      line('<span class="ok">⏺</span> <span class="tl">' + s[1] + '</span>(' + esc(s[2]) + ')');
      line('  <span class="dim">⎿  ' + esc(s[3]) + '</span>');
      if (s[0] === 'edit') { line('     <span class="add">+  const hour = new Date().getHours() + new Date().getMinutes() / 60;</span>'); line('     <span class="add">+  const sky = blendSky(SKY_BY_HOUR, hour);</span>'); }
    } else if (s[0] === 'done') line('<span class="cc">⏺</span> ' + esc(s[1]));

  $('cAuto').onclick = () => { auto = !auto; $('cAuto').classList.toggle('on', auto); if (auto) { spinStart = performance.now(); later(400); } spinner(); };
  function clock() {
    const d = new Date();
    $('clock').textContent = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(',', '') + '  ' +

  }

  if (q.has('dock')) st.dock = q.get('dock') || null;
  if (q.has('thru')) setThru(true);
  if (q.has('opacity')) { $('op').value = q.get('opacity'); $('op').oninput(); }
  layout(false);
  if (q.get('size') === 'F') enterFull();
  if (q.has('freew')) { st.w = Math.max(MINW, Math.min(MAXW, +q.get('freew'))); layout(false); }
  clock(); setInterval(clock, 15000);
  if (TEST) runTest();
  else {
    // ?pause=1: a still frame for screenshots, with a short burst of terminal lines already in
    if (q.has('pause')) { auto = true; for (let i = 0; i < +(q.get('lines') || 6); i++) next(); clearTimeout(termT); spinner(); draw(true); }
    else { later(800); setInterval(spinner, 120); requestAnimationFrame(frame); }
  }

  // ---------- ?test=1: scripted checks ----------
  function runTest() {
    clearTimeout(termT);
    const checks = [];
    const ok = (name, pass, info) => checks.push({ name, pass: !!pass, info });
    const rect = () => { const r = farm.getBoundingClientRect(), s = screen.getBoundingClientRect(); return { x: Math.round((r.left - s.left) / k), y: Math.round((r.top - s.top) / k), w: Math.round(r.width / k), h: Math.round(r.height / k) }; };
    const key = (k2, type) => window.dispatchEvent(new KeyboardEvent(type || 'keydown', { key: k2, bubbles: true }));

    const s1 = cam.s; ok('ants drawn at the small size', lastAnts && lastAnts.drawn > 3, lastAnts);
    key('2'); r = rect(); sizes.push(r);

    ok('the farm zooms in to fill the larger window', cam.s > s1, { small: s1, large: cam.s });

    const dir = g.dataset.corner[1] === 'l' ? -1 : 1, vdir = g.dataset.corner[0] === 't' ? -1 : 1;
    window.dispatchEvent(new PointerEvent('pointermove', { clientX: gx + dir * 130 * k, clientY: gy + vdir * 10 * k, pointerId: 3, bubbles: true }));
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: gx + dir * 130 * k, clientY: gy + vdir * 10 * k, pointerId: 3, bubbles: true }));
    r = rect(); sizes.push(r);
    ok('drag resize keeps 16:9', Math.abs(r.w / r.h - 16 / 9) < 0.02 && r.w > 700, r);
    ok('drag resize keeps the docked corner', st.dock === 'br' ? r.x + r.w === SW - MARGIN && r.y + r.h === WORK.y + WORK.h - MARGIN : true, { r, dock: st.dock });
    key('f'); r = rect();
    ok('full screen covers the screen', r.w === SW && r.h === SH && r.x === 0 && r.y === 0, r);
    ok('ants drawn full screen', lastAnts && lastAnts.drawn > 3, lastAnts);
    key('Escape'); r = rect();
    ok('Esc leaves full screen back to the last size', !st.full && Math.abs(r.w - sizes[2].w) <= 1, r);
    $('cF').click(); $('wFull').click();
    ok('full screen button toggles both ways', !st.full);
    // docking
    const want = { tl: [MARGIN, WORK.y + MARGIN], tr: [SW - MARGIN, WORK.y + MARGIN], bl: [MARGIN, WORK.y + WORK.h - MARGIN], br: [SW - MARGIN, WORK.y + WORK.h - MARGIN] };
    key('1');
    for (const d of ['tl', 'tr', 'bl', 'br']) {
      $('d' + d.toUpperCase()).click(); r = rect();
      const cx = d[1] === 'l' ? r.x : r.x + r.w, cy = d[0] === 't' ? r.y : r.y + r.h;
      ok('docks ' + d + ' 12 px from the corner', cx === want[d][0] && cy === want[d][1], r);
    }
    // drag the bar into the middle (free), then near the top-left corner: it snaps there
    const bar = $('bar'), br0 = bar.getBoundingClientRect(), sr = screen.getBoundingClientRect();
    const bx = br0.left + 40, by = br0.top + 8;
    bar.dispatchEvent(new PointerEvent('pointerdown', { clientX: bx, clientY: by, pointerId: 4, bubbles: true }));
    window.dispatchEvent(new PointerEvent('pointermove', { clientX: sr.left + 600 * k, clientY: sr.top + 400 * k, pointerId: 4, bubbles: true }));
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: sr.left + 600 * k, clientY: sr.top + 400 * k, pointerId: 4, bubbles: true }));
    ok('dragging to the middle leaves it free', st.dock === null, rect());
    const b1 = bar.getBoundingClientRect();
    bar.dispatchEvent(new PointerEvent('pointerdown', { clientX: b1.left + 40, clientY: b1.top + 8, pointerId: 5, bubbles: true }));
    window.dispatchEvent(new PointerEvent('pointermove', { clientX: sr.left + (40 + 30) * k, clientY: sr.top + (WORK.y + 8 + 25) * k, pointerId: 5, bubbles: true }));
    window.dispatchEvent(new PointerEvent('pointerup', { clientX: sr.left + 70 * k, clientY: sr.top + (WORK.y + 33) * k, pointerId: 5, bubbles: true }));
    ok('let go near a corner, it snaps to it', st.dock === 'tl', { dock: st.dock, r: rect() });
    // click-through: the desktop gets the click, Alt grabs the window again
    key('t');
    r = farm.getBoundingClientRect();
    const hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    ok('click-through passes the mouse to what is behind', st.thru && !farm.contains(hit), hit && hit.className);
    key('Alt');
    const hit2 = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    ok('holding Option grabs the window again', farm.contains(hit2));
    key('Alt', 'keyup'); key('t');
    ok('click-through toggles off', !st.thru && farm.contains(document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2)));
    $('op').value = 40; $('op').oninput();
    ok('opacity slider sets the window opacity', Math.abs(parseFloat(farm.style.opacity) - 0.4) < 0.01, farm.style.opacity);
    $('op').value = 100; $('op').oninput();
    // the colony reacts to tokens
    const e0 = sim.energy, c0 = sim.stats.crumbsSpawned, t0 = sim.stats.tokens;
    key('k'); const e1 = sim.energy; sim.run(400);
    ok('token feed adds energy, tokens and food', e1 > e0 && sim.stats.tokens === t0 + 5000 && sim.stats.crumbsSpawned > c0, { e0, e1, crumbs: sim.stats.crumbsSpawned - c0 });
    ok('the bar shows the event', $('evt').textContent.includes('tokens') && $('pulse').classList.contains('hot'), $('evt').textContent);
    const g0 = sim.galleryQueue.length + sim.projects.length;
    $('cTask').click();
    ok('task done orders a gallery', sim.galleryQueue.length + sim.projects.length > g0);
    // hide to the menu bar and back
    key('h'); ok('hides to the menu bar', farm.style.display === 'none');
    $('mbAnt').click(); ok('menu bar icon brings it back', farm.style.display !== 'none');
    // the terminal steps feed tokens too
    const t1 = sim.stats.tokens; next(); next();
    ok('Claude Code steps feed the farm', sim.stats.tokens > t1, { before: t1, after: sim.stats.tokens });
    draw(true);
    const d = ctx.getImageData(0, 0, view.width, view.height).data, seen = new Set();
    for (let i = 0; i < d.length; i += 4 * 53) seen.add((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]);
    ok('the farm is drawn', seen.size > 12, { colours: seen.size });
    ok('no page errors', errors.length === 0, errors);
    const pass = checks.every((c) => c.pass);
    $('result').textContent = JSON.stringify({ pass, seed: sim.seed, tick: sim.tick, checks }, null, 1);
    document.title = pass ? 'PASS' : 'FAIL';
  }
})();
</script>
</body>
